<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stocktake Buddy</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap');

        body {
            font-family: 'Libre Baskerville', serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            background-color: #1c1c1c;
            position: relative;
        }

        .top-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 90px;
            background-color: black;
            z-index: 1;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            color: white;
            background-color: black;
            text-align: center;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 0;
            font-size: 48px;
            padding: 20px 10px 5px 10px;
            letter-spacing: 0.05em;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        .button {
            display: inline-block;
            margin: 8px 0;
            width: 80%;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            border: 2px solid #a89a68;
            background-color: transparent;
            cursor: pointer;
            text-align: center;
            text-transform: uppercase;
            box-sizing: border-box;
        }

        .button::after {
            content: ' →';
            color: #a89a68;
        }

        .upload-btn-wrapper {
            width: 100%;
            box-sizing: border-box;
            margin-left: 20%;
        }

        .upload-btn-wrapper input[type="file"] {
            display: none;
        }

        input[type="text"],
        input[type="number"] {
            width: 80%;
            max-width: 800px;
            margin: 20px 0;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        table {
            width: 80%;
            max-width: 800px;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            word-wrap: break-word;
        }

        th {
            background-color: #a89a68;
            color: #1c1c1c;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        .hidden {
            display: none;
        }

        .video-wrapper {
            width: 80%;
            max-width: 400px;
            overflow: hidden;
            clip-path: inset(33% 0 33% 0);
            margin: 0;
        }

        video {
            display: block;
            width: 100%;
            margin: -80px 0;
        }

        .prompt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .prompt-box {
            background-color: #1c1c1c;
            padding: 20px;
            border: 2px solid #a89a68;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            max-width: 90%;
            box-sizing: border-box;
        }

        .prompt-box input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            box-sizing: border-box;
        }

        .prompt-box button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            border: 2px solid #a89a68;
            background-color: transparent;
            cursor: pointer;
            text-transform: uppercase;
        }

        .prompt-box button:hover {
            background-color: #a89a68;
            color: #1c1c1c;
        }

        .barcode-cell {
            max-width: 10ch;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .prompt-video-wrapper {
            width: 100%;
            max-width: 300px;
            overflow: hidden;
            clip-path: inset(33% 0 33% 0);
            margin: 10px auto;
            display: none;
        }

        .prompt-video-wrapper video {
            display: block;
            width: 100%;
            margin: -80px 0;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 34px;
            }

            table {
                width: 95%;
                font-size: 14px;
            }

            .button,
            input[type="text"],
            input[type="number"] {
                width: 90%;
            }

            .upload-btn-wrapper {
                margin-left: 10%;
            }

            th,
            td {
                padding: 6px;
            }
        }
    </style>
</head>

<body>
    <div class="top-wrapper"></div>

    <h1>STOCKTAKE BUDDY</h1>

    <div class="upload-btn-wrapper">
        <button
            type="button"
            class="button"
            onclick="document.getElementById('fileInput').click()"
        >
            Upload Excel file
        </button>

        <input
            type="file"
            id="fileInput"
            accept=".xlsx,.xls"
            onchange="handleFile(event)"
        >
    </div>

    <div class="video-wrapper">
        <video id="video"></video>
    </div>

    <button
        type="button"
        id="scanButton"
        class="button"
        onclick="scanBarcode()"
    >
        Scan Barcode
    </button>

    <input
        type="text"
        id="searchInput"
        placeholder="Search..."
        onkeyup="searchTable()"
    >

    <table id="dataGrid">
        <thead>
            <tr id="headerRow"></tr>
        </thead>

        <tbody id="dataBody"></tbody>
    </table>

    <button
        type="button"
        id="downloadButton"
        class="button"
        onclick="downloadCSV()"
    >
        Download Count
    </button>

    <a id="downloadLink" style="display: none;"></a>

    <button
        type="button"
        class="button"
        onclick="clearAllData()"
    >
        Clear All Data
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>

    <script>
        /*
         * The detected Barcode column.
         * Defaults to column B if a Barcode heading cannot be found.
         */
        let BARCODE_COL_INDEX = 1;

        document.addEventListener('DOMContentLoaded', function () {
            loadTableData();
            setTimeout(debugBarcodes, 1000);
        });

        function handleFile(event) {
            const file = event.target.files[0];

            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function (readerEvent) {
                try {
                    const data = new Uint8Array(
                        readerEvent.target.result
                    );

                    const workbook = XLSX.read(data, {
                        type: 'array'
                    });

                    const firstSheet =
                        workbook.Sheets[workbook.SheetNames[0]];

                    const jsonData = XLSX.utils.sheet_to_json(
                        firstSheet,
                        {
                            header: 1,
                            defval: ''
                        }
                    );

                    populateTable(jsonData);
                    saveTableData(jsonData);
                } catch (error) {
                    console.error(error);

                    alert(
                        'The spreadsheet could not be opened. ' +
                        'Please check that it is a valid Excel file.'
                    );
                }
            };

            reader.readAsArrayBuffer(file);
        }

        function debugBarcodes() {
            console.log('--- DEBUG BARCODES ---');

            const barcodeKeys = Object.keys(localStorage).filter(
                key => key.startsWith('barcode_')
            );

            console.log(
                `Found ${barcodeKeys.length} saved barcodes in localStorage`
            );

            barcodeKeys.forEach(key => {
                const value = localStorage.getItem(key);
                console.log(`${key}: ${value}`);
            });

            const rows = document
                .getElementById('dataBody')
                .getElementsByTagName('tr');

            console.log(`Current table has ${rows.length} rows`);

            Array.from(rows).forEach((row, index) => {
                const originalIndex = row.dataset.originalIndex;

                const barcodeCell =
                    row.getElementsByTagName('td')[
                        BARCODE_COL_INDEX
                    ];

                const barcodeText = barcodeCell
                    ? barcodeCell.textContent
                    : 'no cell';

                const savedBarcode = localStorage.getItem(
                    `barcode_${originalIndex}`
                );

                console.log(
                    `Row ${index} ` +
                    `(original index: ${originalIndex}): ` +
                    `displayed="${barcodeText}", ` +
                    `saved="${savedBarcode}"`
                );
            });
        }

        function populateTable(data) {
            const headerRow =
                document.getElementById('headerRow');

            const dataBody =
                document.getElementById('dataBody');

            headerRow.innerHTML = '';
            dataBody.innerHTML = '';

            if (!Array.isArray(data) || data.length === 0) {
                return;
            }

            let barcodeIndex = -1;
            let theoryIndex = -1;

            const headings = Array.isArray(data[0])
                ? data[0]
                : [];

            /*
             * Create headings using Excel row 1.
             */
            headings.forEach((header, index) => {
                const th = document.createElement('th');

                th.textContent =
                    header !== undefined && header !== null
                        ? header
                        : '';

                const cleanHeader = String(
                    header !== undefined && header !== null
                        ? header
                        : ''
                )
                    .toLowerCase()
                    .trim();

                if (cleanHeader === 'barcode') {
                    barcodeIndex = index;

                    console.log(
                        `Found barcode column at index ${barcodeIndex}`
                    );
                }

                if (cleanHeader === 'theory') {
                    theoryIndex = index;
                }

                headerRow.appendChild(th);
            });

            /*
             * Add the Actual heading.
             */
            const actualHeader = document.createElement('th');
            actualHeader.textContent = 'Actual';
            headerRow.appendChild(actualHeader);

            /*
             * Default Barcode to column B if its heading was not found.
             */
            if (barcodeIndex === -1) {
                barcodeIndex = 1;

                console.warn(
                    'Barcode column was not found. ' +
                    'Defaulting to the second column.'
                );
            }

            BARCODE_COL_INDEX = barcodeIndex;

            let displayRowIndex = 0;

            /*
             * data.slice(1) removes Excel row 1 because it contains
             * the headings.
             *
             * The first row remaining is Excel row 2.
             * Therefore originalRowIndex 0 is Excel row 2.
             */
            data.slice(1).forEach(
                (row, originalRowIndex) => {
                    /*
                     * REMOVE EXCEL ROW 2.
                     *
                     * This removes the unwanted row containing the total
                     * such as 1,665.1721. Products begin from Excel row 3.
                     */
                    if (originalRowIndex === 0) {
                        return;
                    }

                    if (!Array.isArray(row)) {
                        return;
                    }

                    const tr = document.createElement('tr');

                    /*
                     * Preserve the existing index scheme so saved counts
                     * and manually entered barcodes continue to work.
                     */
                    tr.dataset.originalIndex =
                        originalRowIndex;

                    /*
                     * Always create the same number of cells as there are
                     * headings. This keeps Actual in the correct column.
                     */
                    for (
                        let cellIndex = 0;
                        cellIndex < headings.length;
                        cellIndex++
                    ) {
                        const cell = row[cellIndex];
                        const td = document.createElement('td');

                        if (
                            cellIndex === theoryIndex &&
                            theoryIndex !== -1
                        ) {
                            const theoryValue =
                                parseFloat(cell);

                            td.textContent =
                                Number.isFinite(theoryValue)
                                    ? theoryValue.toFixed(1)
                                    : '';
                        } else {
                            td.textContent =
                                cell !== undefined &&
                                cell !== null
                                    ? cell
                                    : '';
                        }

                        if (cellIndex === barcodeIndex) {
                            td.classList.add(
                                'barcode-cell'
                            );
                        }

                        tr.appendChild(td);
                    }

                    /*
                     * Add the Actual count input.
                     */
                    const inputTd =
                        document.createElement('td');

                    const input =
                        document.createElement('input');

                    input.type = 'number';
                    input.style.width = '6ch';
                    input.step = '0.1';
                    input.min = '0';

                    inputTd.appendChild(input);
                    tr.appendChild(inputTd);
                    dataBody.appendChild(tr);

                    const barcodeCell =
                        tr.getElementsByTagName('td')[
                            barcodeIndex
                        ];

                    /*
                     * Restore a previously saved count.
                     * Checking against null means zero is restored too.
                     */
                    const savedInputValue =
                        localStorage.getItem(
                            `inputValue_${originalRowIndex}`
                        );

                    if (savedInputValue !== null) {
                        input.value = savedInputValue;
                    }

                    /*
                     * Restore a previously entered barcode.
                     */
                    const savedBarcode =
                        localStorage.getItem(
                            `barcode_${originalRowIndex}`
                        );

                    if (savedBarcode && barcodeCell) {
                        barcodeCell.textContent =
                            savedBarcode;
                    }

                    /*
                     * Save the count whenever it changes.
                     */
                    input.addEventListener(
                        'input',
                        function () {
                            localStorage.setItem(
                                `inputValue_${originalRowIndex}`,
                                input.value
                            );

                            /*
                             * If a product has a count but no barcode,
                             * ask for the barcode.
                             */
                            if (
                                input.value !== '' &&
                                barcodeCell &&
                                barcodeCell.textContent.trim() === ''
                            ) {
                                promptForBarcode().then(
                                    barcode => {
                                        if (barcode) {
                                            barcodeCell.textContent =
                                                barcode;

                                            localStorage.setItem(
                                                `barcode_${originalRowIndex}`,
                                                barcode
                                            );
                                        }
                                    }
                                );
                            }
                        }
                    );

                    displayRowIndex++;
                }
            );

            console.log(
                `Table populated with ${displayRowIndex} rows. ` +
                `Barcode column index: ${barcodeIndex}`
            );
        }

        function searchTable() {
            const searchInput =
                document.getElementById('searchInput');

            const filter =
                searchInput.value.toLowerCase().trim();

            const rows = document
                .getElementById('dataBody')
                .getElementsByTagName('tr');

            Array.from(rows).forEach(row => {
                const cells =
                    row.getElementsByTagName('td');

                let match = false;

                Array.from(cells).forEach(cell => {
                    const cellText = String(
                        cell.textContent || ''
                    ).toLowerCase();

                    if (cellText.includes(filter)) {
                        match = true;
                    }
                });

                row.style.display = match ? '' : 'none';
            });
        }

        function scanBarcode() {
            const searchInput =
                document.getElementById('searchInput');

            searchInput.value = '';

            const codeReader =
                new ZXing.BrowserBarcodeReader();

            codeReader
                .decodeOnceFromVideoDevice(
                    undefined,
                    'video'
                )
                .then(result => {
                    searchInput.value = result.text;
                    searchTable();
                })
                .catch(error => {
                    console.error(error);
                });
        }

        /*
         * Export only rows that have:
         * 1. A count entered, including zero.
         * 2. A barcode.
         *
         * Rows without counts are not exported.
         */
        function downloadCSV() {
            const rows = document
                .getElementById('dataBody')
                .getElementsByTagName('tr');

            const exportData = [];

            Array.from(rows).forEach(row => {
                const cells =
                    row.getElementsByTagName('td');

                if (!cells || cells.length === 0) {
                    return;
                }

                const actualCell =
                    cells[cells.length - 1];

                const input =
                    actualCell.querySelector('input');

                const count = input
                    ? String(input.value).trim()
                    : '';

                /*
                 * Skip products that have no entered count.
                 * The value "0" is accepted as a count.
                 */
                if (count === '') {
                    return;
                }

                const barcodeCell =
                    cells[BARCODE_COL_INDEX];

                const barcode = barcodeCell
                    ? String(barcodeCell.textContent)
                        .replace(/[\r\n\s]+/g, '')
                        .trim()
                    : '';

                /*
                 * Skip counted products with no barcode.
                 * Normally the barcode-entry prompt prevents this.
                 */
                if (barcode === '') {
                    return;
                }

                exportData.push(
                    `${barcode},${count}`
                );
            });

            if (exportData.length === 0) {
                alert(
                    'Nothing to export. Enter a count for at least one product.'
                );

                return;
            }

            const fileContent =
                exportData.join('\n');

            const blob = new Blob(
                [fileContent],
                {
                    type: 'text/plain;charset=utf-8;'
                }
            );

            const url =
                URL.createObjectURL(blob);

            const downloadLink =
                document.getElementById('downloadLink');

            downloadLink.href = url;
            downloadLink.download = 'export.txt';
            downloadLink.style.display = 'none';

            downloadLink.click();

            setTimeout(function () {
                URL.revokeObjectURL(url);
            }, 100);
        }

        function saveTableData(data) {
            localStorage.setItem(
                'tableData',
                JSON.stringify(data)
            );
        }

        function loadTableData() {
            const storedData =
                localStorage.getItem('tableData');

            if (!storedData) {
                return;
            }

            try {
                const tableData =
                    JSON.parse(storedData);

                populateTable(tableData);
            } catch (error) {
                console.error(
                    'Could not load the stored table:',
                    error
                );

                localStorage.removeItem('tableData');
            }
        }

        function promptForBarcode() {
            return new Promise(resolve => {
                const promptOverlay =
                    document.createElement('div');

                promptOverlay.className =
                    'prompt-overlay';

                const promptBox =
                    document.createElement('div');

                promptBox.className =
                    'prompt-box';

                const promptText =
                    document.createElement('p');

                promptText.textContent =
                    'This product does not have a barcode.\n\n' +
                    'Please enter the barcode or scan it.';

                promptBox.appendChild(promptText);

                const input =
                    document.createElement('input');

                input.type = 'text';
                input.placeholder = 'Enter barcode';

                promptBox.appendChild(input);

                const videoWrapper =
                    document.createElement('div');

                videoWrapper.className =
                    'prompt-video-wrapper';

                const video =
                    document.createElement('video');

                video.id = 'prompt-video';

                videoWrapper.appendChild(video);
                promptBox.appendChild(videoWrapper);

                const stopPromptScanner = function () {
                    if (window.promptCodeReader) {
                        window.promptCodeReader.reset();
                        delete window.promptCodeReader;
                    }
                };

                const closePrompt = function (value) {
                    stopPromptScanner();

                    if (
                        promptOverlay.parentElement
                    ) {
                        promptOverlay.parentElement.removeChild(
                            promptOverlay
                        );
                    }

                    resolve(value);
                };

                const scanButton =
                    document.createElement('button');

                scanButton.type = 'button';
                scanButton.textContent =
                    'Scan Barcode';

                scanButton.addEventListener(
                    'click',
                    function () {
                        if (
                            videoWrapper.style.display ===
                            'block'
                        ) {
                            videoWrapper.style.display =
                                'none';

                            stopPromptScanner();

                            scanButton.textContent =
                                'Scan Barcode';
                        } else {
                            videoWrapper.style.display =
                                'block';

                            scanButton.textContent =
                                'Hide Camera';

                            scanBarcodeForPrompt(
                                input,
                                video,
                                scanButton,
                                videoWrapper
                            );
                        }
                    }
                );

                promptBox.appendChild(scanButton);

                const submitButton =
                    document.createElement('button');

                submitButton.type = 'button';
                submitButton.textContent = 'Submit';

                submitButton.addEventListener(
                    'click',
                    function () {
                        const barcode =
                            input.value.trim();

                        if (
                            /^[a-zA-Z0-9]+$/.test(
                                barcode
                            )
                        ) {
                            closePrompt(barcode);
                        } else {
                            alert(
                                'Invalid input. Please enter a valid alphanumeric barcode.'
                            );

                            input.style.borderColor =
                                'red';

                            input.focus();
                        }
                    }
                );

                promptBox.appendChild(submitButton);

                const cancelButton =
                    document.createElement('button');

                cancelButton.type = 'button';
                cancelButton.textContent = 'Cancel';

                cancelButton.addEventListener(
                    'click',
                    function () {
                        closePrompt(null);
                    }
                );

                promptBox.appendChild(cancelButton);

                promptOverlay.appendChild(promptBox);
                document.body.appendChild(promptOverlay);

                input.focus();
            });
        }

        function scanBarcodeForPrompt(
            input,
            videoElement,
            scanButton,
            videoWrapper
        ) {
            if (window.promptCodeReader) {
                window.promptCodeReader.reset();
            }

            window.promptCodeReader =
                new ZXing.BrowserBarcodeReader();

            window.promptCodeReader
                .decodeFromVideoDevice(
                    undefined,
                    videoElement,
                    function (result, error) {
                        if (result) {
                            input.value = result.text;

                            videoWrapper.style.display =
                                'none';

                            scanButton.textContent =
                                'Scan Barcode';

                            if (
                                window.promptCodeReader
                            ) {
                                window.promptCodeReader.reset();

                                delete window.promptCodeReader;
                            }
                        }

                        if (
                            error &&
                            !(
                                error instanceof
                                ZXing.NotFoundException
                            )
                        ) {
                            console.error(error);
                        }
                    }
                )
                .catch(error => {
                    console.error(error);

                    videoWrapper.style.display =
                        'none';

                    scanButton.textContent =
                        'Scan Barcode';
                });
        }

        function clearAllData() {
            const confirmation = confirm(
                'You are about to clear all data.\n\n' +
                'Do you wish to continue?'
            );

            if (!confirmation) {
                return;
            }

            /*
             * Clear the spreadsheet, saved counts and added barcodes.
             */
            localStorage.clear();

            document.getElementById(
                'headerRow'
            ).innerHTML = '';

            document.getElementById(
                'dataBody'
            ).innerHTML = '';

            document.getElementById(
                'searchInput'
            ).value = '';

            document.getElementById(
                'fileInput'
            ).value = '';

            alert('All data has been cleared.');
        }
    </script>
</body>
</html>
